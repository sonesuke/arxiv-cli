[package]
name = "arxiv-cli"
version = "0.0.5"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5.53", features = ["derive"] }
directories = "6.0.0"
pdf-extract = "0.10.0"
quick-xml = { version = "0.36", features = ["serialize"] }
reqwest = { version = "0.12.24", features = ["blocking", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["full"] }
urlencoding = "2.1.3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[[test]]
name = "e2e_cli"
path = "e2e/cli.rs"

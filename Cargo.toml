[package]
name = "arxiv-cli"
version = "0.1.4"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
futures = "0.3.30"
pdf-extract = "0.10.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.8"
tempfile = "3.23.0"
thiserror = "1.0"
tokio = { version = "1.48.0", features = ["full"] }
tokio-tungstenite = { version = "0.26.1", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
urlencoding = "2.1.3"
uuid = { version = "1.11.0", features = ["v4"] }
directories = "6.0.0"
chrome-cdp = { git = "https://github.com/sonesuke/chrome-cdp", branch = "main" }
# MCP SDK
rmcp = { version = "0.16", features = ["server", "macros", "transport-io"] }
schemars = "1.2"

[dependencies.openssl-sys]
version = "0.9"
features = ["vendored"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[[test]]
name = "e2e_cli"
path = "e2e/cli.rs"

[[test]]
name = "e2e_mcp"
path = "e2e/mcp.rs"

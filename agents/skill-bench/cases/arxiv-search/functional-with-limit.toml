name = "arxiv-search-functional-with-limit"
description = "Test arxiv-search with custom limit parameter"
timeout = 120

test_prompt = """
Use arxiv-search to find 20 papers about machine learning
"""

[[checks]]
name = "mcp-success"
command = "mcp-success"

[[checks]]
name = "limit-param"
command = "param"
tool = "search_papers"
param = "limit"
value = "20"
